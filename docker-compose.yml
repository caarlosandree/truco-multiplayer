services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: truco
      POSTGRES_PASSWORD: truco
      POSTGRES_DB: truco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truco -d truco"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
